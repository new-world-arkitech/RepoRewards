[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flowmind"
version = "1.0.0"
description = "Autonomous Multi-Agent Repository Flow Archaeology, Deliberation Council, and Reasoning Coding Agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "networkx>=3.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "httpx>=0.24.0",
    "pytest>=7.0.0",
]

[project.optional-dependencies]
redis = ["redis>=5.0.0"]
nats = ["nats-py>=2.6.0"]
anthropic = ["anthropic>=0.25.0"]
opentelemetry = [
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
]
server = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "httpx>=0.24.0",
]
all = [
    "redis>=5.0.0",
    "nats-py>=2.6.0",
    "anthropic>=0.25.0",
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "httpx>=0.24.0",
]

[project.scripts]
flowmind = "repo_investigator.cli:run_cli"

[tool.setuptools.packages.find]
include = ["repo_investigator*"]
exclude = ["sample_repo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--basetemp=.pytest_temp"
