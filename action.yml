name: "FlowMind Architectural Invariant Audit & A2A Reviewer"
description: "Autonomous Multi-Agent Repository Flow Archaeology, Invariant Audits, and PR Reviewer"
author: "Cosmic Souls Of Sovereignty Inc. (@new-world-arkitech)"
branding:
  icon: "cpu"
  color: "purple"

inputs:
  repo-path:
    description: "Path to repository to scan and audit"
    required: false
    default: "."
  tier:
    description: "Execution tier: auto, 1, 2, or 3"
    required: false
    default: "auto"
  dry-run:
    description: "Execute reasoning loop without modifying files on disk"
    required: false
    default: "true"
  report-html:
    description: "Path to generate the client-facing interactive HTML report"
    required: false
    default: "flowmind-report.html"
  post-pr-comment:
    description: "Post architectural audit scorecard as a comment to GitHub Pull Request"
    required: false
    default: "true"
  fail-on-gates:
    description: "Fail the workflow if any architectural invariant gates fail"
    required: false
    default: "true"
  github-token:
    description: "GitHub token used for posting PR comments"
    required: false
    default: ${{ github.token }}

outputs:
  report-path:
    description: "Path to generated HTML report artifact"
    value: ${{ inputs.report-html }}

runs:
  using: "node24"
  main: "index.js"
