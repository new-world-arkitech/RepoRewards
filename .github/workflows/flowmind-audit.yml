name: FlowMind Architectural Invariant Audit & PR Reviewer

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull Request number to audit and review"
        required: false
        default: ""
      head_sha:
        description: "Head commit SHA"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write
  issues: write
  statuses: write
  checks: write

jobs:
  audit-invariants:
    name: Autonomous Multi-Agent Architectural Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code with Git History
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Configure Git Runner Identity
        run: |
          git config --global user.name "FlowMind CI Runner"
          git config --global user.email "ci@flowmind.dev"
          git config --global init.defaultBranch main
          git config --global --add safe.directory "*"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Execute FlowMind Invariant Audit Action (Node.js 24)
        uses: ./
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          tier: auto
          dry-run: true
          report-html: flowmind-report.html
          post-pr-comment: true
          fail-on-gates: true

      - name: Upload HTML Executive Architecture Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flowmind-architecture-report
          path: flowmind-report.html
          if-no-files-found: warn
