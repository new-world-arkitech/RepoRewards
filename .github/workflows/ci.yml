name: FlowMind CI / CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        python-version: [ "3.10", "3.11", "3.12", "3.13" ]
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure Git Runner Identity
        shell: bash
        run: |
          git config --global user.name "FlowMind CI Runner"
          git config --global user.email "ci@flowmind.dev"
          git config --global init.defaultBranch main
          git config --global --add safe.directory "*"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[all]"
          python -m pip install pytest httpx

      - name: Run Test Suite
        shell: bash
        run: |
          python -m pytest -v

  build-wheel:
    name: Build & Validate Distribution Wheel
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flowmind-dist
          path: dist/*

  validate-node24-action:
    name: Validate Node.js 24 Action & Runtime
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Verify Node.js 24 Engine & Run Action Tests
        run: |
          node -v
          npm test
